{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="bg-white rounded-2xl shadow-xl max-w-lg mx-auto p-8">
    <h2 class="text-2xl font-bold text-center text-blue-700 mb-6">Course Login</h2>

    <form method="POST" class="space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-gray-700 font-medium">Username</label>
            <input 
                name="username" 
                type="text" 
                required 
                class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-400"
                placeholder="Enter your username">
        </div>

        <div>
            <label class="block text-gray-700 font-medium">Password</label>
            <input 
                name="password" 
                type="password" 
                required 
                class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-400"
                placeholder="Enter your password">
        </div>

        {% if messages %}
        <div class="rounded-md bg-red-50 p-4">
            <div class="text-sm text-red-700">
                {% for message in messages %}
                    <p>{{ message }}</p>
                {% endfor %}
            </div>
        </div>
        {% endif %}

        <button 
            type="submit" 
            class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg w-full font-semibold">
            Sign In
        </button>

        <div class="text-center mt-4">
            <a href="{% url 'teacher_signup' %}" class="text-blue-600 hover:text-blue-800">
                Don't have an account? Sign up
            </a>
        </div>
    </form>
</div>
{% endblock %}
