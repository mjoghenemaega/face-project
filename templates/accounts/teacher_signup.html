{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="bg-white rounded-2xl shadow-xl max-w-lg mx-auto p-8">
    <h2 class="text-2xl font-bold text-center text-blue-700 mb-6">Teacher Course Registration</h2>

    <form method="POST" class="space-y-4">
        {% csrf_token %}
        
        <div>
            <label class="block text-gray-700 font-medium">Username</label>
            <input 
                type="text" 
                name="username" 
                required 
                class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-400"
                placeholder="Choose a username">
        </div>

        <div>
            <label class="block text-gray-700 font-medium">Email</label>
            <input 
                type="email" 
                name="email" 
                required 
                class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-400"
                placeholder="Enter your email">
        </div>

        <div>
            <label class="block text-gray-700 font-medium">First Name</label>
            <input 
                type="text" 
                name="first_name" 
                required 
                class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-400"
                placeholder="Enter your first name">
        </div>

        <div>
            <label class="block text-gray-700 font-medium">Last Name</label>
            <input 
                type="text" 
                name="last_name" 
                required 
                class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-400"
                placeholder="Enter your last name">
        </div>

        <div>
            <label class="block text-gray-700 font-medium">Password</label>
            <input 
                type="password" 
                name="password1" 
                required 
                class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-400"
                placeholder="Create a password">
        </div>

        <div>
            <label class="block text-gray-700 font-medium">Confirm Password</label>
            <input 
                type="password" 
                name="password2" 
                required 
                class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-400"
                placeholder="Confirm your password">
        </div>

        {% if messages %}
        <div class="rounded-md bg-red-50 p-4">
            <div class="text-sm text-red-700">
                {% for message in messages %}
                    <p>{{ message }}</p>
                {% endfor %}
            </div>
        </div>
        {% endif %}

        <button 
            type="submit" 
            class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg w-full font-semibold">
            Register
        </button>

        <div class="text-center mt-4">
            <a href="{% url 'login' %}" class="text-blue-600 hover:text-blue-800">
                Already have an account? Sign in
            </a>
        </div>
    </form>
</div>
{% endblock %}
