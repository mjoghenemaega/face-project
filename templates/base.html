{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Attendance System</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- Navigation Bar -->
    <nav class="bg-blue-600 text-white p-4">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">Class Attendance System</h1>
            {% if user.is_authenticated %}
            <div class="flex items-center space-x-4">
                <span>Welcome, {{ user.get_full_name|default:user.username }}</span>
                <a href="{% url 'logout' %}" class="bg-blue-500 hover:bg-blue-700 px-4 py-2 rounded">Logout</a>
            </div>
            {% endif %}
        </div>
    </nav>

    <div class="container mx-auto p-6">
        <div class="bg-white rounded-2xl shadow-xl max-w-lg mx-auto p-8">
            {% block content %}{% endblock %}
        </div>
    </div>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
